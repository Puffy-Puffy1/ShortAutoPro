name: ShortAutoPro Render Engine V2 Stress

on:
  pull_request:
    paths:
      - "render_engine_v2.py"
      - "render_v2/**"
      - "tests_sim/test_render_engine_v2_ffmpeg.py"
      - "tests_sim/test_render_engine_v2_stress.py"
      - "main.py"
      - ".github/actions/setup-ffmpeg/action.yml"
      - "batch_runtime.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consecutive-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "render_v2/package.json"
      - name: Set up FFmpeg and FFprobe
        uses: ./.github/actions/setup-ffmpeg
      - name: Install Remotion dependencies
        working-directory: render_v2
        run: npm install --no-audit --no-fund
      - name: Verify Android-safe Remotion bundler
        working-directory: render_v2
        run: npm run verify:android-bundle
      - name: TypeScript check
        working-directory: render_v2
        run: npx tsc --noEmit
      - name: Native FFmpeg backend contract
        env:
          SAP_RENDER_V2_BACKEND: "ffmpeg"
        run: python -m unittest tests_sim.test_render_engine_v2_ffmpeg
      - name: Run 1 -> 2 -> 5 -> 10 qualification
        env:
          SAP_RENDER_V2_CONCURRENCY: "2"
          SAP_RENDER_V2_CRF: "20"
          SAP_RENDER_V2_TIMEOUT_SECONDS: "300"
        run: python tests_sim/test_render_engine_v2_stress.py
