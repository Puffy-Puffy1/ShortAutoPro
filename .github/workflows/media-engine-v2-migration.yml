name: ShortAutoPro Media Acquisition V3 Migration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "media_acquisition_v3.py"
      - "media_v3/**"
      - "render_plan_v2.py"
      - "render_engine_v2.py"
      - "main.py"
      - "production_recovery.py"
      - "tests_sim/**"
      - "docs/MEDIA_ENGINE_V2_MIGRATION_AUDIT.md"
      - ".github/workflows/media-engine-v2-migration.yml"
  push:
    branches:
      - "feature/retire-stage6-media-engine-v2"
      - "audit/media-acquisition-v2"
    paths:
      - "media_engine_v2.py"
      - "render_plan_v2.py"
      - "render_engine_v2.py"
      - "tests_sim/**"
      - "media_provider_v2.py"
      - "media_provider_router_v2.py"
      - "media_validator_v2.py"
      - "tests/test_media_acquisition_v2.py"
      - ".github/workflows/media-engine-v2-migration.yml"

permissions:
  contents: read

jobs:
  migration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic test dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet requests
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python compile
        run: python -m compileall -q media_engine_v2.py media_provider_v2.py media_provider_router_v2.py media_validator_v2.py render_plan_v2.py render_engine_v2.py tests tests_sim
      - name: Media Engine V2 unit and failure tests
        run: |
          python -m unittest -v             tests_sim.test_media_engine_v2_contract             tests_sim.test_media_engine_v2_failure_modes             tests_sim.test_media_provider_v2             tests_sim.test_media_engine_v2_integration             tests_sim.test_render_plan_v2
      - name: Independent Media Acquisition V2 tests
        run: python -m unittest -v tests.test_media_acquisition_v2
      - name: Architecture boundary audit
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path("main.py").read_text()
          v3 = Path("media_acquisition_v3.py").read_text()
          render = Path("render_engine_v2.py").read_text()
          checks = {
              "no_media_stage_runtime_main": "media_stage_runtime.py" not in main,
              "no_media_engine_v2_execution_main": 'p.run("MEDIA ENGINE V2 - ACQUIRE + VALIDATE + FREEZE MANIFEST", "media_engine_v2.py"' not in main,
              "main_uses_media_acquisition_v3": "media_acquisition_v3.py" in main,
              "main_uses_render_plan_v2": "render_plan_v2.py" in main,
              "v3_manifest_contract": "media-manifest-v2" in v3,
              "render_manifest_contract": "media-manifest-v2" in render,
          }
          for name, ok in checks.items():
              print(f"{name}={'PASS' if ok else 'FAIL'}")
          assert all(checks.values()), checks
          PY
          python -m unittest -v tests.test_media_acquisition_v3 tests.test_media_acquisition_v3_stress
          echo "MEDIA_ACQUISITION_V3_CONTRACT=PASS"
      - name: Real FFmpeg/FFprobe render E2E
        run: python -m unittest -v tests_sim.test_render_engine_v2_manifest_e2e
      - name: Consecutive 1-2-5-10 isolation
        run: python -m unittest -v tests_sim.test_render_engine_v2_stress
