name: ShortAutoPro Media Engine V2 Migration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "media_engine_v2.py"
      - "media_provider_v2.py"
      - "media_provider_router_v2.py"
      - "media_validator_v2.py"
      - "media_must_verifier.py"
      - "render_plan_v2.py"
      - "render_engine_v2.py"
      - "main.py"
      - "production_recovery.py"
      - "tests_sim/**"
      - "docs/MEDIA_ENGINE_V2_MIGRATION_AUDIT.md"
      - ".github/workflows/media-engine-v2-migration.yml"
  push:
    branches:
      - "feature/retire-stage6-media-engine-v2"
      - "audit/media-acquisition-v2"
    paths:
      - "media_engine_v2.py"
      - "render_plan_v2.py"
      - "render_engine_v2.py"
      - "tests_sim/**"
      - "media_provider_v2.py"
      - "media_provider_router_v2.py"
      - "media_validator_v2.py"
      - "tests/test_media_acquisition_v2.py"
      - ".github/workflows/media-engine-v2-migration.yml"

permissions:
  contents: read

jobs:
  migration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic test dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet requests
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Python compile
        run: python -m compileall -q scene_director.py scene_must_policy.py media_engine_v2.py media_provider_v2.py media_provider_router_v2.py media_validator_v2.py render_plan_v2.py render_engine_v2.py tests tests_sim
      - name: Media Engine V2 unit and failure tests
        run: |
          python -m unittest -v             tests_sim.test_media_engine_v2_contract             tests_sim.test_media_engine_v2_failure_modes             tests_sim.test_media_provider_v2             tests_sim.test_media_engine_v2_integration             tests_sim.test_render_plan_v2             tests_sim.test_media_external_resilience tests_sim.test_scene_must_policy
      - name: Independent Media Acquisition V2 tests
        run: python -m unittest -v tests.test_media_acquisition_v2
      - name: Architecture boundary audit
        run: |
          set -euo pipefail
          ! grep -q "media_stage_runtime.py" main.py
          ! grep -q "media_stage_runtime" media_engine_v2.py
          grep -q "media_engine_v2.py" main.py
          grep -q "render_plan_v2.py" main.py
          grep -q "media-manifest-v2" media_engine_v2.py
          grep -q "media-manifest-v2" render_engine_v2.py
          echo "STAGE6_BYPASS_CONTRACT=PASS"
      - name: Real FFmpeg/FFprobe render E2E
        run: python -m unittest -v tests_sim.test_render_engine_v2_manifest_e2e
      - name: Consecutive 1-2-5-10 isolation
        run: python -m unittest -v tests_sim.test_render_engine_v2_stress
