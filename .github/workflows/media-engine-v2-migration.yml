name: ShortAutoPro Canonical Media Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "media_acquisition_v3.py"
      - "media_v3/**"
      - "pipeline_contracts.py"
      - "first_video.py"
      - "render_plan_v2.py"
      - "render_engine_v2.py"
      - "main.py"
      - "production_recovery.py"
      - "recovery_controller.py"
      - "tests/**"
      - "tests_sim/**"
      - ".github/workflows/media-engine-v2-migration.yml"
  push:
    branches:
      - "refactor/canonical-pipeline-first-video-20261006"
    paths:
      - "media_acquisition_v3.py"
      - "media_v3/**"
      - "pipeline_contracts.py"
      - "first_video.py"
      - "render_plan_v2.py"
      - "render_engine_v2.py"
      - "main.py"
      - "production_recovery.py"
      - "recovery_controller.py"
      - "tests/**"
      - ".github/workflows/media-engine-v2-migration.yml"

permissions:
  contents: read

jobs:
  canonical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests
      - name: Python compile
        run: python -m compileall -q media_acquisition_v3.py media_v3 pipeline_contracts.py first_video.py render_plan_v2.py render_engine_v2.py recovery_controller.py production_recovery.py tests
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Canonical contract and architecture tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Real FFmpeg/FFprobe render E2E
        env:
          SAP_RENDER_V2_BACKEND: "ffmpeg"
        run: python -m unittest -v tests_sim.test_render_engine_v2_manifest_e2e tests_sim.test_render_engine_v2_ffmpeg
      - name: Consecutive 1-2-5-10 render isolation
        env:
          SAP_RENDER_V2_BACKEND: "ffmpeg"
        run: python -m unittest -v tests_sim.test_render_engine_v2_stress
