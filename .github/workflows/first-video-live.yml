name: ShortAutoPro FIRST_VIDEO Live Proof

on:
  push:
    branches:
      - fix/first-video-canonical-entrypoint-20261014
    paths:
      - ".github/workflows/first-video-live.yml"
      - "main.py"
      - "scene_lossless_repair.py"
      - "profile_runtime.py"
      - "config/channel_profiles.json"
      - "preflight_check.sh"
      - "health_check.sh"
      - "visual_pipeline_bridge_v42.py"
      - "visual_selection_engine_v4.py"
  workflow_dispatch:
    inputs:
      topic:
        description: "Theme for the first real Short (for example: dark fantasy, mysteries, science)"
        required: true
        type: string
      short_id:
        description: "Optional deterministic short id"
        required: false
        type: string

permissions:
  contents: read

jobs:
  first-video-live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      SHORTAUTOPRO_BASE: ${{ github.workspace }}
      FIRST_VIDEO_LIVE: "1"
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node for Remotion
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "render_v2/package.json"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg

      - name: Install Remotion dependencies
        working-directory: render_v2
        run: npm install --no-audit --no-fund

      - name: Verify Remotion bundle
        working-directory: render_v2
        run: npm run verify:android-bundle

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # The repository currently has no requirements.txt; install the
          # shared HTTP client explicitly so Wikipedia and Gemini can import.
          pip install --upgrade piper-tts requests

      - name: Install Piper voice model
        run: |
          python -m piper.download_voices pt_BR-faber-medium --data-dir "$GITHUB_WORKSPACE/piper/voice"
          test -s "$GITHUB_WORKSPACE/piper/voice/pt_BR-faber-medium.onnx"
          test -s "$GITHUB_WORKSPACE/piper/voice/pt_BR-faber-medium.onnx.json"

      - name: Build Whisper.cpp and download model
        run: |
          set -euo pipefail
          WHISPER_ROOT="$RUNNER_TEMP/whisper.cpp"
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git "$WHISPER_ROOT"
          cmake -S "$WHISPER_ROOT" -B "$WHISPER_ROOT/build"
          cmake --build "$WHISPER_ROOT/build" --config Release -j2 --target whisper-cli
          bash "$WHISPER_ROOT/models/download-ggml-model.sh" base
          test -x "$WHISPER_ROOT/build/bin/whisper-cli"
          test -s "$WHISPER_ROOT/models/ggml-base.bin"

      - name: Verify required live credentials
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo "::error::Missing GEMINI_API_KEY"; exit 1; }
          if [ -z "$PEXELS_API_KEY" ]; then echo "Pexels unavailable; continuing to configured fallback providers."; fi
          if [ -z "$PIXABAY_API_KEY" ]; then echo "Pixabay unavailable; continuing to configured fallback providers."; fi

      - name: Run FIRST_VIDEO
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ inputs.topic || 'mistérios históricos e casos inexplicáveis' }}
          SHORT_ID: ${{ inputs.short_id }}
          WHISPER_CLI: ${{ runner.temp }}/whisper.cpp/build/bin/whisper-cli
          WHISPER_MODEL: ${{ runner.temp }}/whisper.cpp/models/ggml-base.bin
        shell: bash
        run: |
          set -euo pipefail

          # main.py is the repository's canonical production entrypoint.
          # config.sh is machine-local and intentionally not committed; an empty
          # runner-local shim lets the workflow rely on injected Actions env vars.
          if [ ! -f config.sh ]; then
            echo '# Ephemeral GitHub Actions config shim; secrets are injected via env.' > config.sh
          fi

          PROFILE_EXPORTS="$(python profile_runtime.py --profile default --shell)"
          eval "$PROFILE_EXPORTS"
          export SHORT_TEMA="$TOPIC"
          export SHORTAUTOPRO_BASE="$GITHUB_WORKSPACE"
          export FIRST_VIDEO_LIVE=1

          echo "FIRST_VIDEO_ENTRYPOINT=main.py"
          echo "FIRST_VIDEO_PROFILE=$SAP_CHANNEL_PROFILE"
          echo "FIRST_VIDEO_THEME=$SHORT_TEMA"
          python main.py run

      - name: Validate generated MP4 with FFprobe
        run: |
          set -euo pipefail
          latest="$(find videos -maxdepth 1 -type f -name 'short_v6_*.mp4' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$latest"
          test -s "$latest"
          ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name,width,height,avg_frame_rate -of json "$latest" > first_video_ffprobe.json
          python - <<'PY'
          import json
          d=json.load(open("first_video_ffprobe.json",encoding="utf-8"))
          vs=next(x for x in d["streams"] if x.get("codec_type")=="video")
          au=next(x for x in d["streams"] if x.get("codec_type")=="audio")
          assert (vs.get("width"),vs.get("height"))==(1080,1920)
          assert vs.get("codec_name")=="h264"
          assert au.get("codec_name")=="aac"
          assert vs.get("avg_frame_rate") in {"30/1","30000/1001"}
          assert float(d["format"].get("duration") or 0)>0
          print("FIRST_VIDEO_FFPROBE=PASS")
          PY
          
      - name: Upload FIRST_VIDEO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-video-live-evidence
          path: |
            videos/short_v6_*.mp4
            reports/first_video/*.json
            reports/media/*.json
            manifests/scene_map_*.json
            manifests/media_*.json
            roteiros/pro_edit_plan_*.json
            first_video_ffprobe.json
          if-no-files-found: warn
