name: ShortAutoPro FIRST_VIDEO Live Proof

on:
  push:
    branches:
      - fix/first-video-canonical-entrypoint-20261014
      - fix/scene-narration-context-20261027
    paths:
      - ".github/workflows/first-video-live.yml"
      - ".github/actions/setup-ffmpeg/action.yml"
      - "main.py"
      - "roteiro.py"
      - "script_claim_traceability.py"
      - "audio.py"
      - "audio_finalizer.py"
      - "tests_sim/test_audio_finalizer.py"
      - "tests_sim/test_audio_base.py"
      - "scene_lossless_repair.py"
      - "scene_director.py"
      - "documentary_director.py"
      - "tests_sim/test_documentary_director_recovery.py"
      - "tests_sim/test_documentary_json_normalization.py"
      - "scene_must_policy.py"
      - "semantic_integrity_gate.py"
      - "media_engine_v2.py"
      - "media_visual_verifier.py"
      - "gemini_runtime.py"
      - "tests_sim/test_media_visual_verifier.py"
      - "tests_sim/test_gemini_runtime_unification.py"
      - "tests_sim/test_media_engine_v2_failure_modes.py"
      - "tests_sim/test_scene_must_policy.py"
      - "tests_sim/test_media_engine_v2_contract.py"
      - "media_must_verifier.py"
      - "media_provider_router_v2.py"
      - "profile_runtime.py"
      - "config/channel_profiles.json"
      - "preflight_check.sh"
      - "health_check.sh"
      - "visual_pipeline_bridge_v42.py"
      - "visual_selection_engine_v4.py"
      - "visual_qa.py"
      - "tests_sim/test_rendered_visual_diversity.py"
      - "tests_sim/test_media_provider_v2.py"
      - "production_manifest.py"
      - "render_engine_v2.py"
      - "tests/test_media_acquisition_v2.py"
      - "tests_sim/test_render_engine_v2_contract.py"
      - "tests_sim/test_render_engine_v2_manifest_e2e.py"
      - "release_gate.py"
      - "shortauto_brain.py"
      - "shortauto_intelligence_layer.py"
      - "tests_sim/test_shortauto_intelligence_layer.py"
      - "script_fallback.py"
      - "tests_sim/test_script_claim_traceability.py"
      - "tests_sim/test_media_must_verifier.py"
      - "tests_sim/test_shortauto_brain_integration.py"
      - "tests_sim/test_shortauto_brain_evidence_map.py"
      - "tests_sim/test_pipeline_gates.py"
      - "docs/ARCHITECTURE_CONSOLIDATION_HISTORY.md"
      - "tests_sim/test_first_video_validation_contract.py"
      - "first_video_run_contract.py"
      - "tests_sim/test_first_video_run_contract.py"
  workflow_dispatch:
    inputs:
      topic:
        description: "Theme for the first real Short (for example: dark fantasy, mysteries, science)"
        required: true
        type: string
      short_id:
        description: "Optional deterministic short id"
        required: false
        type: string

concurrency:
  group: shortautopro-first-video-${{ github.ref }}
  # A proof must match the current branch head; replace obsolete in-progress runs.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  first-video-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      SHORTAUTOPRO_BASE: ${{ github.workspace }}
      FIRST_VIDEO_LIVE: "1"
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node for Remotion
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "render_v2/package.json"

      - name: Set up FFmpeg and FFprobe
        uses: ./.github/actions/setup-ffmpeg

      - name: Install Remotion dependencies
        working-directory: render_v2
        run: npm install --no-audit --no-fund

      - name: Verify Remotion bundle
        working-directory: render_v2
        run: npm run verify:android-bundle

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # The repository currently has no requirements.txt; install the
          # shared HTTP client explicitly so Wikipedia and Gemini can import.
          pip install --upgrade piper-tts requests

      - name: Install Piper voice model
        run: |
          python -m piper.download_voices pt_BR-faber-medium --data-dir "$GITHUB_WORKSPACE/piper/voice"
          test -s "$GITHUB_WORKSPACE/piper/voice/pt_BR-faber-medium.onnx"
          test -s "$GITHUB_WORKSPACE/piper/voice/pt_BR-faber-medium.onnx.json"

      - name: Build Whisper.cpp and download model
        run: |
          set -euo pipefail
          WHISPER_ROOT="$RUNNER_TEMP/whisper.cpp"
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git "$WHISPER_ROOT"
          cmake -S "$WHISPER_ROOT" -B "$WHISPER_ROOT/build"
          cmake --build "$WHISPER_ROOT/build" --config Release -j2 --target whisper-cli
          bash "$WHISPER_ROOT/models/download-ggml-model.sh" base
          test -x "$WHISPER_ROOT/build/bin/whisper-cli"
          test -s "$WHISPER_ROOT/models/ggml-base.bin"

      - name: Verify required live credentials
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo "::error::Missing GEMINI_API_KEY"; exit 1; }
          if [ -z "$PEXELS_API_KEY" ]; then echo "Pexels unavailable; continuing to configured fallback providers."; fi
          if [ -z "$PIXABAY_API_KEY" ]; then echo "Pixabay unavailable; continuing to configured fallback providers."; fi

      - name: Verify source-traceable script fallback
        run: python -m unittest tests_sim.test_script_claim_traceability -v

      - name: Verify narration-only factual evidence
        run: python -m unittest tests_sim.test_shortauto_brain_evidence_map -v

      - name: Verify post-gate MP4 validation contract
        run: python -m unittest tests_sim.test_first_video_validation_contract -v

      - name: Verify generated-video vs release-approval contract
        run: python -m unittest tests_sim.test_first_video_run_contract -v

      - name: Run FIRST_VIDEO
        id: run-first-video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAP_BRAIN_ENFORCE: "1"
          TOPIC: ${{ inputs.topic || 'mistérios históricos e casos inexplicáveis' }}
          SHORT_ID: ${{ inputs.short_id }}
          WHISPER_CLI: ${{ runner.temp }}/whisper.cpp/build/bin/whisper-cli
          WHISPER_MODEL: ${{ runner.temp }}/whisper.cpp/models/ggml-base.bin
        shell: bash
        run: |
          set -euo pipefail

          # main.py is the repository's canonical production entrypoint.
          # config.sh is machine-local and intentionally not committed; an empty
          # runner-local shim lets the workflow rely on injected Actions env vars.
          if [ ! -f config.sh ]; then
            echo '# Ephemeral GitHub Actions config shim; secrets are injected via env.' > config.sh
          fi

          # Give each workflow attempt a fresh, isolated production ID.
          RUN_SHORT_ID="${SHORT_ID:-gha_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}}"
          export SHORT_ID="$RUN_SHORT_ID"
          echo "short_id=$RUN_SHORT_ID" >> "$GITHUB_OUTPUT"

          PROFILE_EXPORTS="$(python profile_runtime.py --profile default --shell)"
          eval "$PROFILE_EXPORTS"
          # Pin TTS to the exact model downloaded and checked by this workflow.
          # This avoids runtime voice-name lookup differences across Piper CLI versions.
          PIPER_MODEL_PATH="$GITHUB_WORKSPACE/piper/voice/pt_BR-faber-medium.onnx"
          test -s "$PIPER_MODEL_PATH"
          export PIPER_MODEL="$PIPER_MODEL_PATH"
          export SHORT_TEMA="$TOPIC"
          export SHORTAUTOPRO_BASE="$GITHUB_WORKSPACE"
          export FIRST_VIDEO_LIVE=1

          echo "FIRST_VIDEO_ENTRYPOINT=main.py"
          echo "FIRST_VIDEO_PROFILE=$SAP_CHANNEL_PROFILE"
          echo "FIRST_VIDEO_THEME=$SHORT_TEMA"
          # A publish approval block is not a render failure. Capture the canonical
          # pipeline status, then accept only the exact human-approval-only block
          # when this run has a non-empty MP4 and a matching release report.
          set +e
          python main.py run
          run_status=$?
          set -e
          python first_video_run_contract.py --short-id "$RUN_SHORT_ID" --exit-code "$run_status"

      - name: Validate generated MP4 with FFprobe
        if: always() && steps.run-first-video.outputs.short_id != ''
        env:
          SHORT_ID: ${{ steps.run-first-video.outputs.short_id }}
        run: |
          set -euo pipefail
          latest="videos/short_v6_${SHORT_ID}.mp4"
          test -f "$latest" || { echo "::error::Current run did not create $latest"; exit 1; }
          test -s "$latest"
          ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name,width,height,avg_frame_rate -of json "$latest" > first_video_ffprobe.json
          python - <<'PY'
          import json
          d=json.load(open("first_video_ffprobe.json",encoding="utf-8"))
          vs=next(x for x in d["streams"] if x.get("codec_type")=="video")
          au=next(x for x in d["streams"] if x.get("codec_type")=="audio")
          assert (vs.get("width"),vs.get("height"))==(1080,1920)
          assert vs.get("codec_name")=="h264"
          assert au.get("codec_name")=="aac"
          assert vs.get("avg_frame_rate") in {"30/1","30000/1001"}
          assert float(d["format"].get("duration") or 0)>0
          print("FIRST_VIDEO_FFPROBE=PASS")
          PY
          
      - name: Upload FIRST_VIDEO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-video-live-evidence
          path: |
            videos/short_v6_*.mp4
            videos/short_*.ass
            reports/first_video/*.json
            reports/intelligence/*.json
            reports/media/*.json
            reports/evolution/visual_qa_*.json
            manifests/scene_map_*.json
            manifests/media_*.json
            manifests/*_release.json
            manifests/*_quality.json
            manifests/*_render_identity.json
            roteiros/scene_map_*.json
            roteiros/short_*.txt
            roteiros/speech_*.txt
            roteiros/speech_*.json
            roteiros/pro_edit_plan_*.json
            first_video_ffprobe.json
          if-no-files-found: warn
