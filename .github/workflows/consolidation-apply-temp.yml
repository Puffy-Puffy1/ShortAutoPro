name: Consolidation 1.0 Apply Temp

on:
  push:
    branches:
      - chatgpt/consolidation-1-0-20260915

permissions:
  contents: write

concurrency:
  group: consolidation-1-0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consolidate:
    if: ${{ !contains(github.event.head_commit.message, '[consolidated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install portable test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet requests

      - name: Capture before metrics
        shell: bash
        run: |
          set -euo pipefail
          ROOT_CODE_BEFORE=$(find . -maxdepth 1 -type f \( -name '*.py' -o -name '*.sh' \) | wc -l)
          TOTAL_CODE_BEFORE=$(find . -path './.git' -prune -o -type f \( -name '*.py' -o -name '*.sh' \) -print | wc -l)
          echo "ROOT_CODE_BEFORE=$ROOT_CODE_BEFORE" | tee /tmp/before_metrics.txt
          echo "TOTAL_CODE_BEFORE=$TOTAL_CODE_BEFORE" | tee -a /tmp/before_metrics.txt
          python tools/map_active_graph.py --json > /tmp/active_before.json

      - name: Apply Consolidation 1.0
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_consolidation_1_0.py | tee /tmp/consolidation_apply.txt

      - name: Compile active Python graph
        shell: bash
        run: |
          set -euo pipefail
          python tools/map_active_graph.py --json > /tmp/active_after.json
          python - <<'PY'
          import json
          from pathlib import Path
          graph = json.loads(Path('/tmp/active_after.json').read_text(encoding='utf-8'))
          failures=[]
          count=0
          for rel in graph['active_code']:
              if not rel.endswith('.py'):
                  continue
              path=Path(rel)
              try:
                  compile(path.read_text(encoding='utf-8'), rel, 'exec')
                  count += 1
              except Exception as exc:
                  failures.append((rel, repr(exc)))
          print(f'ACTIVE_PYTHON_COMPILED={count}')
          if failures:
              for rel, exc in failures:
                  print('COMPILE_FAIL', rel, exc)
              raise SystemExit(1)
          PY

      - name: Full simulated regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests_sim -p 'test_*.py' -v 2>&1 | tee /tmp/regression.log

      - name: Bash syntax audit outside history
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -path './_arquivo_historico' -prune -o -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          echo BASH_ACTIVE_SYNTAX=PASS

      - name: Consolidation contract checks
        shell: bash
        run: |
          set -euo pipefail
          test ! -f midia_runtime.py
          test -f _arquivo_historico/2026-09-15_pre_consolidation/midia_runtime.py
          grep -q 'largura \* altura < 320 \* 180' midia.py
          grep -q 'def _sap_professional_media_accept_v1' midia.py
          grep -q '"6/12 - SMART MEDIA SELECTOR" "midia.py"' gerar_short.sh
          ! grep -q 'echo "QUALITY: PASS"' gerar_short.sh
          grep -q 'QUALITY_REPORT=' gerar_short.sh
          ARCHIVED=$(find _arquivo_historico/2026-09-15_pre_consolidation -maxdepth 1 -type f \( -name '*.py' -o -name '*.sh' \) | wc -l)
          test "$ARCHIVED" -ge 500
          echo "ARCHIVED_CODE_FILES=$ARCHIVED"
          echo CONSOLIDATION_CONTRACT=PASS

      - name: Write validation report
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_ROOT=$(awk -F= '/ROOT_CODE_BEFORE/{print $2}' /tmp/before_metrics.txt)
          BEFORE_TOTAL=$(awk -F= '/TOTAL_CODE_BEFORE/{print $2}' /tmp/before_metrics.txt)
          AFTER_ROOT=$(find . -maxdepth 1 -type f \( -name '*.py' -o -name '*.sh' \) | wc -l)
          ARCHIVED=$(find _arquivo_historico/2026-09-15_pre_consolidation -maxdepth 1 -type f \( -name '*.py' -o -name '*.sh' \) | wc -l)
          ACTIVE=$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/active_after.json').read_text())
          print(d['counts']['active_code'])
          PY
          )
          INACTIVE=$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/active_after.json').read_text())
          print(d['counts']['inactive_code'])
          PY
          )
          TESTS=$(grep -Eo 'Ran [0-9]+ tests?' /tmp/regression.log | tail -1 | awk '{print $2}')
          cat > docs/CONSOLIDATION_1_0_VALIDATION.md <<EOF
          # ShortAutoPro Consolidation 1.0 — Validation

          Validation status: **PASS**

          - Baseline main: cff280d9445f2ff704b876a766564f33a0f2c36b
          - Root Python/Shell before: **$BEFORE_ROOT**
          - Root Python/Shell after: **$AFTER_ROOT**
          - Total Python/Shell before including tests/tools: **$BEFORE_TOTAL**
          - Active Python/Shell after: **$ACTIVE**
          - Inactive Python/Shell outside historical archive: **$INACTIVE**
          - Root code archived, not deleted: **$ARCHIVED**
          - Full tests_sim executed: **${TESTS:-unknown}** — **PASS**
          - Active Python compile: **PASS**
          - Active Bash syntax: **PASS**
          - midia.py static integration equivalence: **PASS**
          - Hardcoded final QUALITY PASS: **REMOVED**

          Historical source remains under _arquivo_historico/2026-09-15_pre_consolidation/ and is excluded from the production graph.
          EOF
          sed -i 's/^          //' docs/CONSOLIDATION_1_0_VALIDATION.md

      - name: Verify working tree diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Commit certified consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ShortAutoPro Consolidation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git restore --source=HEAD -- .github/workflows
          git add -A
          git diff --cached --check
          git commit -m 'ShortAutoPro Consolidation 1.0 [consolidated]'
          git push origin HEAD:chatgpt/consolidation-1-0-20260915
