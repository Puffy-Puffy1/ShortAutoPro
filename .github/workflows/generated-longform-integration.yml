name: ShortAutoPro Generated Clips Long-form Integration
on:
  pull_request:
    branches:
      - fix/unified-longform-entrypoint-20261124
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shortautopro-generated-longform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generated-longform-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Checkout shared local worker dependency
        uses: actions/checkout@v4
        with:
          ref: edad4b8e794c33c76d1bb98dba72d9d444542bdb
          path: .worker-dependency

      - name: Integrate shared worker sources for end-to-end test
        run: |
          cp -R .worker-dependency/generative_video_poc ./generative_video_poc
          git add generative_video_poc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up FFmpeg and FFprobe
        uses: ./.github/actions/setup-ffmpeg

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check --quiet requests

      - name: Python syntax audit
        run: python -m compileall -q .

      - name: Generated manifest and local queue integration tests
        run: python -m unittest tests_sim.test_generated_manifest_integration tests_sim.test_longform_integration tests_sim.test_longform_local_generation tests_sim.test_longform_shared_worker_e2e -v

      - name: Full simulated regression suite
        run: python -m unittest discover -s tests_sim -p "test_*.py" -v
