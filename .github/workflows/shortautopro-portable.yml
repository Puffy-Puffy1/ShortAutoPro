name: ShortAutoPro Portable Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "**.sh"
      - ".github/workflows/**"
      - ".gitignore"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**.sh"
      - ".github/workflows/**"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: shortautopro-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          echo "PORTABLE_FFMPEG_INSTALL=PASS"

      - name: Environment Check
        shell: bash
        run: |
          set -euo pipefail
          git --version
          python --version
          bash --version | head -n 1
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          echo "PORTABLE_ENV=PASS"

      - name: Repository Check
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git log -1 --oneline
          git rev-parse HEAD
          echo "PORTABLE_REPO=PASS"

      - name: Python Syntax Audit
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          echo "PORTABLE_PYTHON_COMPILE=PASS"

      - name: Python AST and PyCompile Audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import pathlib
          import py_compile
          import sys

          failures = []
          for path in pathlib.Path(".").rglob("*.py"):
              if ".git" in path.parts or "__pycache__" in path.parts:
                  continue
              try:
                  source = path.read_text(encoding="utf-8")
                  ast.parse(source, filename=str(path))
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
          if failures:
              print("PORTABLE_PY_STATIC=FAIL")
              print("\n".join(failures))
              sys.exit(1)
          print("PORTABLE_PY_STATIC=PASS")
          PY

      - name: Import Smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import batch_runtime
          import media_external_resilience
          import storage_manager
          print("PORTABLE_IMPORT_SMOKE=PASS")
          PY

      - name: Batch Reliability Gate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests_sim.test_fresh_run_after_success \
            tests_sim.test_batch_runtime \
            tests_sim.test_media_resilience_migration_persistence
          echo "PORTABLE_BATCH_RELIABILITY=PASS"

      - name: Deployment Semantic Smoke
        shell: bash
        run: |
          set -euo pipefail
          python tools/deploy_smoke.py
          echo "PORTABLE_DEPLOY_SMOKE=PASS"

      - name: Simulated Regression Tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet requests
          python -m unittest discover -s tests_sim -p "test_*.py" -v
          echo "PORTABLE_SIM_TESTS=PASS"

      - name: Critical Stage 6 Regression Gate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests_sim.test_stage6_completion_contract \
            tests_sim.test_stage6_anchor_timeout_id_fix \
            tests_sim.test_stage6_early_must_recovery \
            tests_sim.test_stage6_fast_strict_path \
            tests_sim.test_stage6_recovery_unwrap \
            tests_sim.test_stage6_semantic_anchor_recovery \
            tests_sim.test_media_stage_runtime \
            tests_sim.test_media_stage_resilience \
            tests_sim.test_media_strict_must_guard \
            tests_sim.test_final_render_contract \
            tests_sim.test_mobile_render_performance \
            tests_sim.test_subtitle_alignment \
            tests_sim.test_termux_bridge_deploy \
            tests_sim.test_termux_stable_promotion \
            tests_sim.test_render_preflight \
            tests_sim.test_media_two_pass_recovery \
            tests_sim.test_pre_render_resilience \
            tests_sim.test_resume_media_suffix \
            tests_sim.test_production_watchdog_health \
            tests_sim.test_visual_query_guard \
            tests_sim.test_rendered_visual_diversity \
            tests_sim.test_canonical_visual_score \
            tests_sim.test_retention_review_contract \
            tests_sim.test_stage6_timeout_resume \
            tests_sim.test_visual_content_integrity \
            tests_sim.test_fresh_run_after_success \
            tests_sim.test_media_external_resilience
          echo "PORTABLE_STAGE6_GATE=PASS"

      - name: JSON Integrity Audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import sys

          failures = []
          for path in pathlib.Path(".").rglob("*.json"):
              if any(part in {".git", "__pycache__"} for part in path.parts):
                  continue
              try:
                  with path.open("r", encoding="utf-8") as handle:
                      json.load(handle)
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("JSON_INTEGRITY=FAIL")
              print("\n".join(failures))
              sys.exit(1)
          print("JSON_INTEGRITY=PASS")
          PY

      - name: FFmpeg Synthetic End-to-End Render
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=black:s=360x640:r=30:d=1.5" \
            -f lavfi -i "sine=frequency=880:sample_rate=48000:duration=1.5" \
            -vf "zoompan=z='min(zoom+0.0015,1.05)':d=1:s=360x640:fps=30" \
            -af "loudnorm=I=-16:LRA=11:TP=-1.5" \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$tmp/e2e.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height \
            -of default=nw=1 "$tmp/e2e.mp4"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name \
            -of default=nw=1 "$tmp/e2e.mp4"
          test -s "$tmp/e2e.mp4"
          echo "PORTABLE_FFMPEG_E2E=PASS"

      - name: Bash Syntax Audit
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          echo "PORTABLE_BASH_SYNTAX=PASS"

      - name: Consolidation 3.0 Pipeline Contract
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            main.py profile_run.sh resume_short_runtime.py \
            professional_edit_director.py professional_edit_repair.py \
            professional_caption_director.py video_professional.py v6_professional.py \
            visual_continuity_engine.py visual_score_engine.py visual_query_guard.py visual_media_refresh.py multi_asset_director.py \
            retention_engine.py sound_design_engine.py speech_director.py \
            caption_layout_guard.py audio_finalizer.py visual_qa.py release_gate.py \
            render_preflight.py production_recovery.py production_watchdog.py production_health.py \
            tools/deploy_smoke.py storage_manager.py professional_quality_gate.py; do
            test -f "$f"
          done

          for legacy in \
            gerar_short.sh gerar_short_professional.sh professional_pipeline_runtime.py \
            resume_short_professional_runtime.py v6_professional_runtime.py \
            v6_runtime.py v6.py video.py limpar_storage.sh; do
            test ! -e "$legacy"
          done

          grep -q 'PROFESSIONAL_CANONICAL' main.py
          grep -q 'video_professional.py' main.py
          grep -q 'v6_professional.py' main.py
          grep -q 'release_gate.py' main.py
          grep -q 'production_recovery.py' main.py
          grep -q 'visual_query_guard.py' main.py
          grep -q 'render_preflight.py' main.py
          grep -q 'production_watchdog.record_heartbeat' main.py
          grep -q 'MAIN="$BASE/main.py"' profile_run.sh
          ! grep -q 'STANDARD_ROLLBACK' main.py
          ! grep -q 'SAP_PRO_EDIT' main.py
          ! grep -q 'STANDARD_ROLLBACK' profile_run.sh
          echo "CONSOLIDATION_3_0_PIPELINE_CONTRACT=PASS"

      - name: Consolidation Repository Audit
        shell: bash
        run: |
          set -euo pipefail
          python tools/repo_audit.py
          echo "CONSOLIDATION_REPOSITORY_AUDIT=PASS"

      - name: FFmpeg Capabilities
        shell: bash
        run: |
          set -euo pipefail
          filters="$(ffmpeg -hide_banner -filters 2>/dev/null)"
          grep -q loudnorm <<<"$filters"
          grep -q sidechaincompress <<<"$filters"
          grep -q xfade <<<"$filters"
          grep -q zoompan <<<"$filters"
          grep -q blackdetect <<<"$filters"
          grep -q cropdetect <<<"$filters"
          echo "PORTABLE_FFMPEG_CAPABILITIES=PASS"

      - name: Final Summary
        if: ${{ always() }}
        shell: bash
        run: |
          echo "======================================"
          echo "SHORTAUTOPRO PORTABLE VALIDATION FINISHED"
          echo "SHA=${GITHUB_SHA}"
          echo "======================================"
