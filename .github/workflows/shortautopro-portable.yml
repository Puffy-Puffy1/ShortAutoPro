name: ShortAutoPro Portable Validation
# portable-v3-final-checkpoint
# V3 migration checkpoint: portable validation is authoritative before merge.
# Resume/checkpoint contracts are validated against the frozen frozen-media manifest.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "**.sh"
      - ".github/workflows/**"
      - ".gitignore"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**.sh"
      - ".github/workflows/**"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: shortautopro-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          echo "PORTABLE_FFMPEG_INSTALL=PASS"

      - name: Environment Check
        shell: bash
        run: |
          set -euo pipefail
          git --version
          python --version
          bash --version | head -n 1
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          echo "PORTABLE_ENV=PASS"

      - name: Repository Check
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git log -1 --oneline
          git rev-parse HEAD
          echo "PORTABLE_REPO=PASS"

      - name: Python Syntax Audit
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          echo "PORTABLE_PYTHON_COMPILE=PASS"

      - name: Deployment Semantic Smoke
        shell: bash
        run: |
          set -euo pipefail
          python tools/deploy_smoke.py
          echo "PORTABLE_DEPLOY_SMOKE=PASS"

      - name: Simulated Regression Tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet requests
          python -m unittest discover -s tests_sim -p "test_*.py" -v
          echo "PORTABLE_SIM_TESTS=PASS"

      - name: Media Acquisition V3 Production Gate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_media_acquisition_v3 \
            tests.test_media_acquisition_v3_stress \
            tests.test_media_v3_render_integration \
            tests.test_media_v3_full_pipeline_stress
          python - <<'PY'
          from pathlib import Path
          main = Path("main.py").read_text(encoding="utf-8")
          checks = {
              "main_uses_v3": '"media_acquisition_v3.py"' in main,
              "main_uses_render_plan_v2": '"render_plan_v2.py"' in main,
              "main_uses_render_v2": '"render_engine_v2.py"' in main,
              "main_does_not_execute_v2": 'p.run("MEDIA ENGINE V2 - ACQUIRE + VALIDATE + FREEZE MANIFEST", "media_engine_v2.py"' not in main,
              "stage6_controller_not_in_main": "media_stage_runtime.py" not in main,
              "legacy_renderer_disabled": "RENDER_ENGINE_LEGACY_DISABLED" in main,
          }
          for name, ok in checks.items():
              print(f"{name}={'PASS' if ok else 'FAIL'}")
          assert all(checks.values()), checks
          print("MEDIA_ACQUISITION_V3_PRODUCTION_CONTRACT=PASS")
          PY

      - name: JSON Integrity Audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import sys

          failures = []
          for path in pathlib.Path(".").rglob("*.json"):
              if any(part in {".git", "__pycache__"} for part in path.parts):
                  continue
              try:
                  with path.open("r", encoding="utf-8") as handle:
                      json.load(handle)
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("JSON_INTEGRITY=FAIL")
              print("\n".join(failures))
              sys.exit(1)
          print("JSON_INTEGRITY=PASS")
          PY

      - name: FFmpeg Synthetic End-to-End Render
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=black:s=360x640:r=30:d=1.5" \
            -f lavfi -i "sine=frequency=880:sample_rate=48000:duration=1.5" \
            -vf "zoompan=z='min(zoom+0.0015,1.05)':d=1:s=360x640:fps=30" \
            -af "loudnorm=I=-16:LRA=11:TP=-1.5" \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$tmp/e2e.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height \
            -of default=nw=1 "$tmp/e2e.mp4"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name \
            -of default=nw=1 "$tmp/e2e.mp4"
          test -s "$tmp/e2e.mp4"
          echo "PORTABLE_FFMPEG_E2E=PASS"

      - name: Bash Syntax Audit
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          echo "PORTABLE_BASH_SYNTAX=PASS"

      - name: Canonical V3 Production Pipeline Contract
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            main.py profile_run.sh resume_short_runtime.py \
            media_engine_v2.py media_provider_v2.py render_plan_v2.py render_engine_v2.py \
            professional_caption_director.py caption_layout_guard.py audio_finalizer.py \
            visual_qa.py professional_quality_gate.py release_gate.py \
            production_recovery.py production_watchdog.py production_health.py \
            tools/deploy_smoke.py storage_manager.py; do
            test -f "$f"
          done

          grep -q 'PROFESSIONAL_CANONICAL' main.py
          grep -q 'media_acquisition_v3.py' main.py
          ! grep -q 'p.run("MEDIA ENGINE V2 - ACQUIRE + VALIDATE + FREEZE MANIFEST", "media_engine_v2.py"' main.py
          grep -q 'render_plan_v2.py' main.py
          grep -q 'render_engine_v2.py' main.py
          grep -q 'media-manifest-v2' render_engine_v2.py
          ! grep -q 'media_stage_runtime.py' main.py
          ! grep -q 'retention_engine.py' main.py
          ! grep -q 'gerar_short.sh' main.py
          ! grep -q 'STANDARD_ROLLBACK' main.py
          grep -q 'MAIN="$BASE/main.py"' profile_run.sh
          echo "V3_PRODUCTION_PIPELINE_CONTRACT=PASS"

      - name: Consolidation Repository Audit
        shell: bash
        run: |
          set -euo pipefail
          python tools/repo_audit.py
          echo "CONSOLIDATION_REPOSITORY_AUDIT=PASS"

      - name: FFmpeg Capabilities
        shell: bash
        run: |
          set -euo pipefail
          filters="$(ffmpeg -hide_banner -filters 2>/dev/null)"
          grep -q loudnorm <<<"$filters"
          grep -q sidechaincompress <<<"$filters"
          grep -q xfade <<<"$filters"
          grep -q zoompan <<<"$filters"
          grep -q blackdetect <<<"$filters"
          grep -q cropdetect <<<"$filters"
          echo "PORTABLE_FFMPEG_CAPABILITIES=PASS"

      - name: Final Summary
        if: ${{ always() }}
        shell: bash
        run: |
          echo "======================================"
          echo "SHORTAUTOPRO PORTABLE VALIDATION FINISHED"
          echo "SHA=${GITHUB_SHA}"
          echo "======================================"
