name: ShortAutoPro Remote Control

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Escolha a ação"
        required: true
        default: "FULL_CHECK"
        type: choice
        options:
          - ENV_CHECK
          - REPO_CHECK
          - PROJECT_INVENTORY
          - PYTHON_COMPILE
          - BASH_SYNTAX
          - HEALTH_CHECK
          - FULL_CHECK
  push:
    branches: [main]
    paths:
      - .github/workflows/shortautopro-remote.yml

permissions:
  contents: read

jobs:
  remote-control:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout ShortAutoPro
        uses: actions/checkout@v4

      - name: Environment Check
        if: ${{ github.event_name == 'push' || inputs.mode == 'ENV_CHECK' || inputs.mode == 'FULL_CHECK' }}
        shell: cmd
        run: |
          echo ======================================
          echo SHORTAUTOPRO ENVIRONMENT CHECK
          echo ======================================
          echo COMPUTER=%COMPUTERNAME%
          git --version
          python --version
          ffmpeg -version
          ffprobe -version
          where git
          where python
          where ffmpeg
          where ffprobe
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          "C:\Program Files\Git\bin\bash.exe" --version
          echo ENV_CHECK=PASS

      - name: Repository Check
        if: ${{ github.event_name == 'push' || inputs.mode == 'REPO_CHECK' || inputs.mode == 'FULL_CHECK' }}
        shell: cmd
        run: |
          echo ======================================
          echo SHORTAUTOPRO REPOSITORY CHECK
          echo ======================================
          git status --short
          git log -1 --oneline
          git rev-parse --short HEAD
          echo REPO_CHECK=PASS

      - name: Project Inventory
        if: ${{ inputs.mode == 'PROJECT_INVENTORY' || inputs.mode == 'FULL_CHECK' }}
        shell: cmd
        run: |
          echo ======================================
          echo SHORTAUTOPRO PROJECT INVENTORY
          echo ======================================
          dir /b
          echo PROJECT_INVENTORY=PASS

      - name: Python Syntax Audit
        if: ${{ github.event_name == 'push' || inputs.mode == 'PYTHON_COMPILE' || inputs.mode == 'FULL_CHECK' }}
        shell: cmd
        run: |
          echo ======================================
          echo SHORTAUTOPRO PYTHON SYNTAX AUDIT
          echo ======================================
          python -m compileall -q .
          if errorlevel 1 exit /b 1
          echo PYTHON_COMPILE=PASS

      - name: Bash Syntax Audit
        if: ${{ github.event_name == 'push' || inputs.mode == 'BASH_SYNTAX' || inputs.mode == 'FULL_CHECK' }}
        shell: cmd
        run: |
          echo ======================================
          echo SHORTAUTOPRO BASH SYNTAX AUDIT
          echo ======================================
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          "C:\Program Files\Git\bin\bash.exe" -lc "find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n"
          if errorlevel 1 exit /b 1
          echo BASH_SYNTAX=PASS

      - name: ShortAutoPro Windows Health Check
        if: ${{ github.event_name == 'push' || inputs.mode == 'HEALTH_CHECK' || inputs.mode == 'FULL_CHECK' }}
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "SHORTAUTOPRO WINDOWS HEALTH CHECK"
          Write-Host "======================================"

          $required = @(
            'config.sh','gerar_short.sh','roteiro.py','scene_director.py',
            'documentary_director.py','visual_director.py','visual_risk_guard.py',
            'editorial_continuity.py','wikimedia_source.py','wikimedia_query_bridge.py',
            'source_router.py','evidence_guard.py','source_ledger.py','motion_director.py',
            'rhythm_director.py','production_supervisor.py','editorial_gate.py','midia.py',
            'audio.py','legenda_dinamica.py','video.py','v6.py','limpar_storage.sh',
            'quality_check.py','hook_engine.py','narrative_director.py','cold_open_director.py',
            'topic_engine.py','topic_memory.py','topic_reserve.py','topic_index.py','wiki_client.py',
            'source_identity.py','register_topic.py','used_topic.py','publish_pack.py',
            'production_manifest.py','final_quality.py','batch_report.py','batch_queue.sh',
            'batch_recovery.sh','control_center.sh','preflight_check.sh','diagnostico.sh',
            'release_check.sh','health_check.sh'
          )

          $missing = @()
          foreach ($file in $required) {
            if (Test-Path $file) {
              Write-Host "OK  $file"
            } else {
              Write-Host "ERRO  $file"
              $missing += $file
            }
          }

          foreach ($cmd in @('git','python','ffmpeg','ffprobe')) {
            if (Get-Command $cmd -ErrorAction SilentlyContinue) {
              Write-Host "OK  $cmd"
            } else {
              Write-Host "ERRO  $cmd"
              $missing += "command:$cmd"
            }
          }

          if (-not (Test-Path 'piper')) {
            Write-Host 'ERRO  pasta piper'
            $missing += 'piper'
          } else {
            Write-Host 'OK  pasta piper'
          }

          if ($missing.Count -gt 0) {
            Write-Host "HEALTH_CHECK=FAIL"
            Write-Host ("MISSING=" + ($missing -join ','))
            exit 1
          }

          Write-Host "HEALTH_CHECK=PASS"

      - name: Final Summary
        if: ${{ always() }}
        shell: powershell
        run: |
          $mode = '${{ inputs.mode }}'
          if ([string]::IsNullOrWhiteSpace($mode)) { $mode = 'AUTO_FULL_CHECK' }
          Write-Host "======================================"
          Write-Host "SHORTAUTOPRO REMOTE CONTROL FINISHED"
          Write-Host "MODE=$mode"
          Write-Host "======================================"
