name: ShortAutoPro Remote Control

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Escolha a ação"
        required: true
        default: "FULL_CHECK"
        type: choice
        options:
          - ENV_CHECK
          - REPO_CHECK
          - PROJECT_INVENTORY
          - PYTHON_COMPILE
          - BASH_SYNTAX
          - HEALTH_CHECK
          - SIM_TESTS
          - DIAGNOSTIC
          - RELEASE_AUDIT
          - FULL_CHECK
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**.sh"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  remote-control:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout ShortAutoPro
        uses: actions/checkout@v4

      - name: Environment Check
        if: ${{ github.event_name == 'push' || inputs.mode == 'ENV_CHECK' || inputs.mode == 'FULL_CHECK' || inputs.mode == 'RELEASE_AUDIT' || inputs.mode == 'DIAGNOSTIC' || inputs.mode == 'SIM_TESTS' }}
        shell: cmd
        run: |
          echo ======================================
          echo SHORTAUTOPRO ENVIRONMENT CHECK
          echo ======================================
          echo COMPUTER=%COMPUTERNAME%
          git --version
          python --version
          ffmpeg -version
          ffprobe -version
          where git
          where python
          where ffmpeg
          where ffprobe
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          "C:\Program Files\Git\bin\bash.exe" --version
          echo ENV_CHECK=PASS

      - name: Repository Check
        if: ${{ github.event_name == 'push' || inputs.mode == 'REPO_CHECK' || inputs.mode == 'FULL_CHECK' || inputs.mode == 'RELEASE_AUDIT' || inputs.mode == 'DIAGNOSTIC' || inputs.mode == 'SIM_TESTS' }}
        shell: cmd
        run: |
          echo ======================================
          echo SHORTAUTOPRO REPOSITORY CHECK
          echo ======================================
          git status --short
          git log -1 --oneline
          git rev-parse --short HEAD
          echo REPO_CHECK=PASS

      - name: Project Inventory
        if: ${{ inputs.mode == 'PROJECT_INVENTORY' || inputs.mode == 'FULL_CHECK' || inputs.mode == 'DIAGNOSTIC' }}
        shell: cmd
        run: |
          echo ======================================
          echo SHORTAUTOPRO PROJECT INVENTORY
          echo ======================================
          echo --- ROOT ---
          dir /b
          echo --- COUNTS ---
          for /f %%C in ('dir /s /b *.py ^| find /c /v ""') do echo PYTHON_FILES=%%C
          for /f %%C in ('dir /s /b *.sh ^| find /c /v ""') do echo SHELL_FILES=%%C
          echo PROJECT_INVENTORY=PASS

      - name: Python Syntax Audit
        if: ${{ github.event_name == 'push' || inputs.mode == 'PYTHON_COMPILE' || inputs.mode == 'FULL_CHECK' || inputs.mode == 'RELEASE_AUDIT' || inputs.mode == 'SIM_TESTS' }}
        shell: cmd
        run: |
          echo ======================================
          echo SHORTAUTOPRO PYTHON SYNTAX AUDIT
          echo ======================================
          python -m compileall -q .
          if errorlevel 1 exit /b 1
          echo PYTHON_COMPILE=PASS

      - name: Simulated Regression Tests
        if: ${{ github.event_name == 'push' || inputs.mode == 'SIM_TESTS' || inputs.mode == 'FULL_CHECK' || inputs.mode == 'RELEASE_AUDIT' }}
        shell: cmd
        run: |
          echo ======================================
          echo SHORTAUTOPRO SIMULATED REGRESSION TESTS
          echo ======================================
          python -m unittest discover -s tests_sim -p "test_*.py" -v
          if errorlevel 1 exit /b 1
          echo SIM_TESTS=PASS

      - name: Bash Syntax Audit
        if: ${{ github.event_name == 'push' || inputs.mode == 'BASH_SYNTAX' || inputs.mode == 'FULL_CHECK' || inputs.mode == 'RELEASE_AUDIT' }}
        shell: cmd
        run: |
          echo ======================================
          echo SHORTAUTOPRO BASH SYNTAX AUDIT
          echo ======================================
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          "C:\Program Files\Git\bin\bash.exe" -lc "find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n"
          if errorlevel 1 exit /b 1
          echo BASH_SYNTAX=PASS

      - name: ShortAutoPro Windows Health Check
        if: ${{ github.event_name == 'push' || inputs.mode == 'HEALTH_CHECK' || inputs.mode == 'FULL_CHECK' || inputs.mode == 'RELEASE_AUDIT' }}
        shell: cmd
        run: |
          echo ======================================
          echo SHORTAUTOPRO WINDOWS HEALTH CHECK
          echo ======================================
          set ERR=0
          if exist config.sh (echo OK  config.sh local) else echo AVISO  config.sh local nao versionado - esperado
          for %%F in (gerar_short.sh roteiro.py scene_director.py documentary_director.py visual_director.py visual_risk_guard.py editorial_continuity.py wikimedia_source.py wikimedia_query_bridge.py source_router.py evidence_guard.py source_ledger.py motion_director.py rhythm_director.py production_supervisor.py editorial_gate.py midia.py audio.py legenda_dinamica.py video.py v6.py limpar_storage.sh quality_check.py hook_engine.py narrative_director.py cold_open_director.py topic_engine.py topic_memory.py topic_reserve.py topic_index.py wiki_client.py source_identity.py register_topic.py used_topic.py publish_pack.py production_manifest.py final_quality.py batch_report.py batch_queue.sh batch_recovery.sh control_center.sh preflight_check.sh diagnostico.sh release_check.sh health_check.sh) do @if not exist "%%F" (echo ERRO  %%F & set ERR=1) else echo OK  %%F
          where git >nul 2>&1 || set ERR=1
          where python >nul 2>&1 || set ERR=1
          where ffmpeg >nul 2>&1 || set ERR=1
          where ffprobe >nul 2>&1 || set ERR=1
          if not exist piper (echo ERRO  pasta piper & set ERR=1) else echo OK  pasta piper
          if "%ERR%"=="1" exit /b 1
          echo HEALTH_CHECK=PASS

      - name: FFmpeg Release Capabilities
        if: ${{ inputs.mode == 'RELEASE_AUDIT' || inputs.mode == 'FULL_CHECK' }}
        shell: cmd
        run: |
          echo ======================================
          echo FFMPEG RELEASE CAPABILITIES
          echo ======================================
          ffmpeg -hide_banner -filters 2>nul | findstr /C:"loudnorm" >nul
          if errorlevel 1 (echo ERRO loudnorm ausente & exit /b 1) else echo OK loudnorm
          ffmpeg -hide_banner -filters 2>nul | findstr /C:"sidechaincompress" >nul
          if errorlevel 1 (echo ERRO sidechaincompress ausente & exit /b 1) else echo OK sidechaincompress
          echo FFMPEG_CAPABILITIES=PASS

      - name: Diagnostic Snapshot
        if: ${{ inputs.mode == 'DIAGNOSTIC' || inputs.mode == 'FULL_CHECK' }}
        shell: cmd
        run: |
          echo ======================================
          echo SHORTAUTOPRO DIAGNOSTIC SNAPSHOT
          echo ======================================
          echo COMPUTER=%COMPUTERNAME%
          echo USER=%USERNAME%
          echo WORKSPACE=%GITHUB_WORKSPACE%
          echo --- DISK ---
          wmic logicaldisk where "DeviceID='C:'" get DeviceID,FreeSpace,Size 2>nul || echo WMIC indisponivel
          echo --- GIT ---
          git status --short
          git log -3 --oneline
          echo DIAGNOSTIC=PASS

      - name: Final Summary
        if: ${{ always() }}
        shell: cmd
        run: |
          echo ======================================
          echo SHORTAUTOPRO REMOTE CONTROL FINISHED
          echo EVENT=%GITHUB_EVENT_NAME%
          echo MODE=${{ inputs.mode }}
          echo ======================================
