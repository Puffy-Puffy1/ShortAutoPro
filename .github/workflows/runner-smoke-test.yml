name: ShortAutoPro Runner Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5

    steps:
      - name: Runner info
        shell: cmd
        run: |
          echo RUNNER_SMOKE_TEST=START
          echo COMPUTER=%COMPUTERNAME%
          echo USER=%USERNAME%
          git --version

      - name: Checkout ShortAutoPro
        uses: actions/checkout@v4

      - name: Verify repository
        shell: cmd
        run: |
          echo REPO=%GITHUB_REPOSITORY%
          git rev-parse --short HEAD
          echo BRANCH=%GITHUB_REF_NAME%
          echo RUNNER_SMOKE_TEST=PASS
