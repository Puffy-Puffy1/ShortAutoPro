name: ShortAutoPro Runner Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5

    steps:
      - name: Runner info
        shell: powershell
        run: |
          Write-Host "RUNNER_SMOKE_TEST=START"
          Write-Host "COMPUTER=$env:COMPUTERNAME"
          Write-Host "USER=$(whoami)"
          git --version
          Write-Host "POWERSHELL=$($PSVersionTable.PSVersion)"

      - name: Checkout ShortAutoPro
        uses: actions/checkout@v4

      - name: Verify repository
        shell: powershell
        run: |
          Write-Host "REPO=$env:GITHUB_REPOSITORY"
          Write-Host "SHA=$(git rev-parse --short HEAD)"
          Write-Host "BRANCH=$env:GITHUB_REF_NAME"
          Write-Host "RUNNER_SMOKE_TEST=PASS"
