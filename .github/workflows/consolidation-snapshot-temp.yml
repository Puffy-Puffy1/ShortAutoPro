name: Consolidation Snapshot Temp

on:
  push:
    branches:
      - chatgpt/consolidation-1-0-20260915

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build branch archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=ShortAutoPro_consolidation_base.zip --prefix=ShortAutoPro/ HEAD
          unzip -t ShortAutoPro_consolidation_base.zip
          git rev-parse HEAD > BASE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ShortAutoPro-consolidation-base
          path: |
            ShortAutoPro_consolidation_base.zip
            BASE_COMMIT.txt
          if-no-files-found: error
          retention-days: 1
